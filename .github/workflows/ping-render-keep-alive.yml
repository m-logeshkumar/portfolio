name: Ping Render Keep-Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send cheap HEAD ping (very low bandwidth)
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://portfolio-bnw5.onrender.com/health

      - name: Occasionally follow redirects to warm frontend (low-frequency)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Perform a full GET that follows redirects only once every 6 runs (~84 minutes)
          if [ $((GITHUB_RUN_NUMBER % 6)) -eq 0 ]; then
            curl -s -o /dev/null -w "%{http_code}" -L https://portfolio-bnw5.onrender.com/health
          else
            echo "Skipping full GET this run to save bandwidth."
          fi
